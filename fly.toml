# fly.toml app configuration file generated for pblbackend on 2026-10-26T05:07:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pblbackend'
primary_region = 'sin'

[build]

[deploy]
  strategy = 'immediate'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/ping'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 512
