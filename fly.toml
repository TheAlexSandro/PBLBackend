# fly.toml app configuration file generated for pblbackend on 2026-11-05T15:07:37Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "pblbackend"
primary_region = 'sin'

[deploy]
  strategy = 'immediate'

[env]
PORT = "3000"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3000
min_machines_running = 1
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]

[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  memory = '256mb'
  size = 'shared-cpu-1x'
  cpus = 1
  memory_mb = 256
  processes = ['app']