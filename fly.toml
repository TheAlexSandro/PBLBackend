app = 'pblbackend'
primary_region = 'sin'

[build]

[deploy]
  strategy = 'immediate'
  #release_command = "npx prisma migrate deploy"

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
  cpu_kind = 'shared'